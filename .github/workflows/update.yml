name: Update PURR mNAV Data

on:
  schedule:
    - cron: "0 1 * * 1-5"   # UTC 01:00 = 北京时间 09:00 (美股交易日)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch data & build dashboard
        run: python fetch_data.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ dashboard/index.html docs/index.html
          git diff --cached --quiet || git commit -m "data: auto update $(date -u +%Y-%m-%d)"
          git push
# Pages 采用 main 分支 /docs 构建模式（docs/index.html 由 fetch_data.py 生成），
# 推送 main 后 Pages 自动重新构建，无需在此部署。
