# schedule re-registered 2026-09-26 (fix: cron lost after account flag)
name: Update PURR mNAV Data

on:
  schedule:
    - cron: "0 1 * * 1-5"   # UTC 01:00 = 北京时间 09:00 (美股交易日)
  workflow_dispatch:
  inputs:
    chain:
      description: "内部使用：链式调度传来的标记，勿手动填写"
      required: false
      default: "0"

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch data & build dashboard
        run: python fetch_data.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ dashboard/index.html docs/index.html
          git diff --cached --quiet || git commit -m "data: auto update $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin "$(git branch --show-current)" || true
          git push
# Pages 采用 main 分支 /docs 构建模式（docs/index.html 由 fetch_data.py 生成），
# 推送 main 后 Pages 自动重新构建，无需在此部署。

      # 兜底：schedule 不可靠（GitHub 免费版常延迟数小时）。
      # 注意：GITHUB_TOKEN 无法触发 workflow_dispatch（防递归），必须用 PAT(CHAIN_TOKEN)。
      # 每次成功后主动触发下一个项目，形成自链式调度。
      - name: Trigger next project (chain)
        if: success() && github.event.inputs.chain != '1'
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.CHAIN_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository_owner }}/memory-scraper/actions/workflows/daily.yml/dispatches \
            -d '{"ref":"main","inputs":{"chain":"1"}}' || true
