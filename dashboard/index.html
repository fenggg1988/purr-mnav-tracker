<style>
  :root {

    --red: #d93a3a; --green: #1a9e6e; --blue: #2f6fed; --orange: #e8890c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "PingFang SC", -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 24px; }
  .header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 22px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .kpi .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .kpi .value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi .value.small { font-size: 17px; }
  .kpi .foot { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .up { color: var(--red); } .down { color: var(--green); }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .panel h2 { font-size: 14px; margin-bottom: 10px; color: var(--text); }
  .chart-wrap { position: relative; height: 300px; }
  .note { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-top: 12px; font-size: 12.5px; color: var(--muted); line-height: 1.8; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.premium { background: #fdecec; color: var(--red); }
  .badge.discount { background: #e6f5ef; color: var(--green); }
</style>
